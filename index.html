<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Shippori+Mincho:wght@400;500;600&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 深海の背景（光のオーブ＋ノイズ） -->
<div class="sea" aria-hidden="true">
  <span class="orb orb-1"></span>
  <span class="orb orb-2"></span>
  <span class="orb orb-3"></span>
  <span class="orb orb-4"></span>
</div>

<!-- 現在深度メーター（スクロールで潜る遊び） -->
<div class="depth" aria-hidden="true">
  <span class="depth-label">DEPTH</span>
  <span class="depth-line"></span>
  <span class="depth-value" id="depthValue">0.0m</span>
</div>

<header class="site-header" id="siteHeader">
  <div class="container header-inner">
    <a class="brand" href="#top">SIAN</a>
    <nav class="global-nav" aria-label="ページ内ナビゲーション">
      <a href="#company">会社概要</a>
    </nav>
  </div>
</header>

<main id="top">

  <!-- ヒーロー：タイプ演出のタグライン一行のみ -->
  <section class="hero">
    <div class="rays" aria-hidden="true"><span></span><span></span><span></span></div>
    <div class="bubbles" aria-hidden="true">
      <i></i><i></i><i></i><i></i><i></i><i></i>
    </div>
    <div class="container hero-inner">
      <p class="hero-tagline" id="tagline">建物のあらゆる情報を、デザインする。<span class="type-cursor" id="typeCursor" aria-hidden="true"></span></p>
      <p class="hero-sub" id="heroSub">合同会社SIANは、“建築情報設計” を拓く設計事務所です。</p>
    </div>
    <div class="hero-scroll" aria-hidden="true">
      <span class="hero-scroll-text">DIVE</span><span class="hero-scroll-line"></span>
    </div>
  </section>

  <!-- 会社概要 -->
  <section class="section" id="company">
    <div class="container">
      <header class="section-head reveal">
        <p class="section-no">01</p>
        <p class="section-en">Company</p>
        <h2 class="section-title">会社概要</h2>
      </header>
      <dl class="company-list reveal">
        <div class="company-row"><dt>社名</dt><dd>合同会社SIAN</dd></div>
        <div class="company-row"><dt>代表</dt><dd>吉川 晃平</dd></div>
        <div class="company-row"><dt>所在地</dt><dd>大阪府大阪市淀川区宮原1-17-33-322 北沢産業ビル3階</dd></div>
        <div class="company-row"><dt>設立</dt><dd>2026年4月</dd></div>
        <div class="company-row"><dt>事業内容</dt><dd>建築情報設計（構造設計・構造計算、BIMモデルの作成、情報要件の定義支援、AIの開発・提供など）</dd></div>
        <div class="company-row"><dt>連絡先</dt><dd><a href="mailto:y@sian.bz">y@sian.bz</a></dd></div>
      </dl>
    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="container">
    <p class="footer-brand" translate="no">SIAN</p>
    <p class="footer-copy">&copy; 2026 合同会社SIAN</p>
  </div>
</footer>

<script>
document.documentElement.classList.add('js');

const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// タグラインのタイプ演出（JS無効・reduced-motion時は最初から全文表示）
const tagline = document.getElementById('tagline');
const cursor = document.getElementById('typeCursor');
const heroSub = document.getElementById('heroSub');
if (reduced) {
  cursor.style.display = 'none';
  heroSub.classList.add('is-visible');
} else {
  const textNode = tagline.firstChild;
  const fullText = textNode.textContent;
  textNode.textContent = '';
  let i = 0;
  const type = () => {
    i++;
    textNode.textContent = fullText.slice(0, i);
    if (i < fullText.length) {
      // 人がタイプしているような揺らぎ。読点の後はひと呼吸置く
      const prev = fullText[i - 1];
      const wait = (prev === '、') ? 420 : 90 + Math.random() * 80;
      setTimeout(type, wait);
    } else {
      // 打ち終わったらひとことを浮かび上がらせ、カーソルは役目を終えて消える
      setTimeout(() => heroSub.classList.add('is-visible'), 500);
      setTimeout(() => cursor.classList.add('is-done'), 2800);
    }
  };
  setTimeout(type, 800);
}

// スクロールに応じたフェードイン（JS無効時は常時表示のまま）
const observer = new IntersectionObserver((entries) => {
  entries.forEach((entry) => {
    if (entry.isIntersecting) {
      entry.target.classList.add('is-visible');
      observer.unobserve(entry.target);
    }
  });
}, { threshold: 0.12 });
document.querySelectorAll('.reveal').forEach((el) => observer.observe(el));

// ヘッダー背景＋現在深度メーター（思案深度：最深40m）
const headerEl = document.getElementById('siteHeader');
const depthEl = document.getElementById('depthValue');
let ticking = false;
function onScroll() {
  const max = document.documentElement.scrollHeight - window.innerHeight;
  const ratio = max > 0 ? window.scrollY / max : 0;
  headerEl.classList.toggle('is-scrolled', window.scrollY > 40);
  depthEl.textContent = (ratio * 40).toFixed(1) + 'm';
  ticking = false;
}
window.addEventListener('scroll', () => {
  if (!ticking) { requestAnimationFrame(onScroll); ticking = true; }
}, { passive: true });
onScroll();
</script>

</body>
</html>
